<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link href="fonts/Roboto-Regular.woff2" type="font/woff2" rel="preload" as="font" crossorigin>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <form>
        <div class="logo-div">
            <img src="book-open-blank-variant.svg" class="book-icon" alt="Book icon">
            <h1 class="library-text">LIBRARY</h1>
        </div>

        <p class="message"></p>

        <label for="book-title-input">
            Title<br>
            <input 
                id="book-title-input" 
                name="book_title"
                type="text" 
                required 
                maxlength="150"
            >
        </label>

        <label for="book-author-input">
            Author<br>
            <input 
                id="book-author-input" 
                name="book_author"
                type="text" 
                required 
                maxlength="70"
            >
        </label>

        <!-- onkeydown logic: dont allow all characters that are not numbers to be typed in -->
        <!--
            Source - https://stackoverflow.com/a/54163655
            Posted by A. Morel, modified by community. See post 'Timeline' for change history
            Retrieved 2026-09-18, License - CC BY-SA 4.0
        -->
        <label for="book-pages-input">
            Number of pages<br>
            <input 
                id="book-pages-input" 
                name="book_pages"
                type="number" 
                required 
                min="1"
                max="10000"
                onkeydown="javascript: return ['Backspace','Delete','ArrowLeft','ArrowRight']
                    .includes(event.code) ? true : !isNaN(Number(event.key)) && event.code!=='Space'
                "
            >
        </label>

        <fieldset>
            <legend>Have you read this book?</legend>

            <label for="yes-radio" class="radio-label">
                Yes
                <input id="yes-radio" value="yes" name="is_book_read" type="radio" checked>
                <span class="custom-radio"></span>
            </label>

            <label for="no-radio" class="radio-label">
                No
                <input id="no-radio" value="no" name="is_book_read" type="radio">
                <span class="custom-radio"></span>
            </label>
        </fieldset>

        <button id="add-book-button">Add Book</button>
    </form>

    <table>
        <thead>
            <th>ID</th>
            <th>Title</th>
            <th>Author</th>
            <th>Pages</th>
            <th>Read</th>
            <th>Action</th>
        </thead>

        <tbody></tbody>
    </table>

    <script src="script.js"></script>
    
</body>
</html>
