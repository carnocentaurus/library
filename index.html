<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <form>
        <label for="book-title-input">
            Book Title:
            <input 
                id="book-title-input" 
                name="book_title"
                type="text" 
                required 
                placeholder="Book Title"
                maxlength="150"
            >
        </label>

        <label for="book-author-input">
            Book Author:
            <input 
                id="book-author-input" 
                name="book_author"
                type="text" 
                required 
                placeholder="Book Author"
                maxlength="70"
            >
        </label>

        <label for="book-pages-input">
            No. of pages:
            <input 
                id="book-pages-input" 
                name="book_pages"
                type="number" 
                required 
                placeholder="No. of pages"
                min="1"
                max="10000"
            >
        </label>

        <fieldset>
            <legend>Have you read this book?</legend>

            <label for="yes-radio">
                Yes
                <input id="yes-radio" value="yes" name="is_book_read" type="radio" checked>
            </label>

            <label for="no-radio">
                No
                <input id="no-radio" value="no" name="is_book_read" type="radio">
            </label>
        </fieldset>

        <button id="add-book-button">Add Book</button>
    </form>

    <button id="show-library-button">Show Library</button>

    <table>
        <caption>Library</caption>

        <thead>
            <th>ID</th>
            <th>Title</th>
            <th>Author</th>
            <th>Pages</th>
            <th>Read</th>
        </thead>

        <tbody></tbody>
    </table>

    <script src="script.js"></script>
    
</body>
</html>
